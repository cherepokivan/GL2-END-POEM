name: Build mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NeoForge mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calculate build version
        id: version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os

          build_number = int(os.environ["BUILD_NUMBER"])
          major = 1 + build_number // 100
          minor = (build_number // 10) % 10
          patch = build_number % 10
          version = f"{major}.{minor}.{patch}"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"MOD_VERSION={version}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"version={version}\n")
          print(f"Building version {version} (workflow run {build_number})")
          PY

      - name: Build
        run: ./gradlew --no-daemon build -Pmod_version="${MOD_VERSION}"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: glpoem-${{ steps.version.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
