plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources.srcDir('src/generated/resources')

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // JCodec + AWT adapter are embedded into the mod JAR through NeoForge Jar-in-Jar.
    jarJar(implementation('org.jcodec:jcodec:0.2.5')) {
        version {
            strictly '[0.2.5,0.2.6)'
            prefer '0.2.5'
        }
    }
    jarJar(implementation('org.jcodec:jcodec-javase:0.2.5')) {
        version {
            strictly '[0.2.5,0.2.6)'
            prefer '0.2.5'
        }
    }

    // Minecraft 1.21.1 dev runs need ordinary Java libraries on additionalRuntimeClasspath.
    additionalRuntimeClasspath 'org.jcodec:jcodec:0.2.5'
    additionalRuntimeClasspath 'org.jcodec:jcodec-javase:0.2.5'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
